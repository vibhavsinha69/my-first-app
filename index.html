<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Retro Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--page:#d8cdbb;--body:#0a140d;--key:#0d1c11;--ink:#22c55e;--dim:#18853b;--line:#1f4a2d;--glow:34,197,94;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a0704}}
:root[data-theme="dark"]{--page:#0a0704}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--page);font-family:'VT323','Courier New',monospace}
.calc{width:100%;max-width:410px;background:var(--body);border:2px solid var(--line);border-radius:18px;padding:16px;
box-shadow:0 0 0 1px #000,0 0 28px rgba(var(--glow),.25),0 18px 40px rgba(0,0,0,.45)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tabs{display:flex;gap:6px}
button{font:inherit;color:var(--ink);background:var(--key);border:1px solid var(--line);border-radius:8px;cursor:pointer;
transition:box-shadow .12s,background .12s,text-shadow .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
button:hover{border-color:var(--ink);box-shadow:0 0 8px rgba(var(--glow),.5)}
button:active,button.hit{background:rgba(var(--glow),.2);border-color:var(--ink);text-shadow:0 0 8px var(--ink);
box-shadow:0 0 12px rgba(var(--glow),.95),0 0 30px rgba(var(--glow),.5),inset 0 0 10px rgba(var(--glow),.45)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tabs button,#ang{font-size:20px;padding:4px 12px}
.tabs button[aria-pressed="true"],#ang{border-color:var(--ink);text-shadow:0 0 6px var(--ink);box-shadow:0 0 10px rgba(var(--glow),.55),inset 0 0 8px rgba(var(--glow),.25)}
.screen{position:relative;border:1px solid var(--line);border-radius:10px;background:#0b0803;padding:10px 14px;margin-bottom:12px;
box-shadow:inset 0 0 22px rgba(var(--glow),.18),0 0 14px rgba(var(--glow),.2);overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.hist{min-height:24px;text-align:right;color:var(--dim);font-size:22px;white-space:nowrap;overflow-x:auto}
.out{text-align:right;color:var(--ink);font-size:64px;line-height:1.05;white-space:nowrap;overflow-x:auto;
text-shadow:0 0 6px rgba(var(--glow),.9),0 0 18px rgba(var(--glow),.5);animation:on .9s steps(1) 1}
@keyframes on{0%{opacity:0}15%{opacity:.9}25%{opacity:.15}40%{opacity:1}55%{opacity:.4}100%{opacity:1}}
.fn{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.fn[hidden]{display:none}
.fn button{font-size:21px;padding:7px 0;color:var(--dim)}
.fn button:hover,.fn button:active,.fn button.hit{color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{font-size:30px;padding:9px 0}
.keys .op{border-color:var(--dim)}
.keys .ac{color:var(--dim)}
.keys .eq{grid-column:span 4;background:var(--ink);color:var(--body);font-size:34px;border-color:var(--ink);box-shadow:0 0 14px rgba(var(--glow),.6)}
.keys .eq:hover,.keys .eq:active,.keys .eq.hit{background:#4ade80;text-shadow:none;box-shadow:0 0 18px rgba(var(--glow),1),0 0 44px rgba(var(--glow),.6)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="calc" aria-label="Retro calculator">
  <div class="bar">
    <div class="tabs" role="group" aria-label="Calculator mode">
      <button data-mode="BASIC" aria-pressed="true">BASIC</button>
      <button data-mode="SCI" aria-pressed="false">SCI</button>
      <button data-mode="ADV" aria-pressed="false">ADV</button>
    </div>
    <button id="ang" aria-label="Toggle degrees or radians">DEG</button>
  </div>
  <section class="screen" aria-live="polite">
    <div class="hist" id="hist"></div>
    <div class="out" id="out">0</div>
  </section>
  <div class="fn" id="fn" hidden></div>
  <div class="keys" id="keys"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const BASIC=[["AC","AC","ac"],["⌫","DEL","ac"],["(","(","op"],[")",")","op"],
["7","7"],["8","8"],["9","9"],["÷","÷","op"],
["4","4"],["5","5"],["6","6"],["×","×","op"],
["1","1"],["2","2"],["3","3"],["−","−","op"],
["0","0"],[".","."],["%","%","op"],["+","+","op"],["=","=","eq"]];
const SCI=[["sin","sin("],["cos","cos("],["tan","tan("],["π","π"],["e","e"],
["sin⁻¹","asin("],["cos⁻¹","acos("],["tan⁻¹","atan("],["ln","ln("],["log","log("],
["√","√("],["x²","^2"],["xʸ","^"],["1/x","^(−1)"],["n!","!"],
["|x|","abs("],["10ˣ","10^"],["eˣ","e^"],["∛","∛("],["ANS","Ans"]];
const ADV=[["sinh","sinh("],["cosh","cosh("],["tanh","tanh("],["log₂","log2("],["floor","floor("],
["asinh","asinh("],["acosh","acosh("],["atanh","atanh("],["ceil","ceil("],["round","round("],
["nCr","nCr"],["nPr","nPr"],["mod","mod"],["rand","rand"],["ANS","Ans"]];

let st={expr:"",res:"",hist:"",ans:0,fresh:false,err:false,deg:true,mode:"BASIC"};

/* ---------- parser ---------- */
const INFIX=new Set(["mod","nCr","nPr"]);
const TOK=/(?:(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+)|(log2|asinh|acosh|atanh|sinh|cosh|tanh|asin|acos|atan|sin|cos|tan|ln|log|sqrt|cbrt|abs|floor|ceil|round|mod|nCr|nPr|rand|Ans|e|π|√|∛)|([+\-−×÷*\/^!%()]))/y;
function tokenize(s){const t=[];let p=0;while(p<s.length){TOK.lastIndex=p;const m=TOK.exec(s);if(!m)throw 0;
if(m[1]!==undefined)t.push({t:"num",v:m[1]});else if(m[2])t.push({t:"id",v:m[2]});else t.push({t:"op",v:m[3]});p=TOK.lastIndex}return t}
function fact(n){if(n<0||!Number.isInteger(n)||n>170)throw 0;let r=1;for(let k=2;k<=n;k++)r*=k;return r}
function perm(n,r){if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<0||r>n)throw 0;let p=1;for(let k=0;k<r;k++)p*=n-k;return p}
function comb(n,r){if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<0||r>n)throw 0;r=Math.min(r,n-r);let c=1;for(let k=1;k<=r;k++)c=c*(n-r+k)/k;return Math.round(c)}
function evaluate(src){
  const D=Math.PI/180,rad=x=>st.deg?x*D:x,deg=x=>st.deg?x/D:x;
  const FN={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),asin:x=>deg(Math.asin(x)),acos:x=>deg(Math.acos(x)),atan:x=>deg(Math.atan(x)),
  sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,asinh:Math.asinh,acosh:Math.acosh,atanh:Math.atanh,ln:Math.log,log:Math.log10,log2:Math.log2,
  sqrt:Math.sqrt,"√":Math.sqrt,cbrt:Math.cbrt,"∛":Math.cbrt,abs:Math.abs,floor:Math.floor,ceil:Math.ceil,round:Math.round};
  const CONST={"π":()=>Math.PI,e:()=>Math.E,Ans:()=>st.ans,rand:()=>Math.random()};
  const toks=tokenize(src);let open=0;toks.forEach(k=>{if(k.v==="(")open++;if(k.v===")")open--});
  while(open-- >0)toks.push({t:"op",v:")"});
  let i=0;const peek=()=>toks[i];
  const expect=v=>{if(!toks[i]||toks[i].v!==v)throw 0;i++};
  function expr(){let v=term();while(peek()&&["+","-","−"].includes(peek().v)){const o=toks[i++].v;const r=term();v=o==="+"?v+r:v-r}return v}
  function term(){let v=unary();for(;;){const p=peek();if(!p)break;
    if(p.v==="×"||p.v==="*"){i++;v*=unary()}
    else if(p.v==="÷"||p.v==="/"){i++;v/=unary()}
    else if(p.v==="mod"){i++;const r=unary();v=((v%r)+r)%r}
    else if(p.v==="nCr"){i++;v=comb(v,unary())}
    else if(p.v==="nPr"){i++;v=perm(v,unary())}
    else if(p.t==="num"||(p.t==="id"&&!INFIX.has(p.v))||p.v==="("){v*=unary()}
    else break}return v}
  function unary(){const p=peek();if(p&&(p.v==="-"||p.v==="−")){i++;return -unary()}if(p&&p.v==="+"){i++;return unary()}return power()}
  function power(){const b=postfix();if(peek()&&peek().v==="^"){i++;return Math.pow(b,unary())}return b}
  function postfix(){let v=primary();while(peek()&&(peek().v==="!"||peek().v==="%")){v=toks[i++].v==="!"?fact(v):v/100}return v}
  function primary(){const t=toks[i++];if(!t)throw 0;
    if(t.t==="num")return parseFloat(t.v);
    if(t.v==="("){const v=expr();expect(")");return v}
    if(t.t==="id"){if(CONST[t.v])return CONST[t.v]();if(FN[t.v]){expect("(");const a=expr();expect(")");return FN[t.v](a)}}
    throw 0}
  const r=expr();if(i<toks.length)throw 0;return r}
function fmt(v){if(!isFinite(v))throw 0;if(Math.abs(v)<1e-13)v=0;const s=parseFloat(v.toPrecision(12)),a=Math.abs(s);
  return(a!==0&&(a>=1e15||a<1e-7))?s.toExponential():String(s)}

/* ---------- state + render ---------- */
const CONT=/^(\+|−|×|÷|\^|!|%|mod|nCr|nPr)/;
const DEL=/(?:[a-z]+2?\(|[√∛]\(|nCr|nPr|mod|rand|Ans|.)$/;
function press(v){
  if(v==="AC"){st.expr=st.res=st.hist="";st.fresh=st.err=false;return render()}
  if(st.err){st.expr=st.res=st.hist="";st.err=false}
  if(v==="DEL"){if(!st.expr&&st.res){st.res=st.hist="";st.fresh=false}else st.expr=st.expr.replace(DEL,"");return render()}
  if(v==="="){if(!st.expr)return;
    try{const r=fmt(evaluate(st.expr));st.hist=st.expr+" =";st.res=r;st.ans=parseFloat(r);st.expr="";st.fresh=true}
    catch(_){st.hist=st.expr;st.res="Error";st.expr="";st.err=true;st.fresh=false}
    return render()}
  if(st.fresh){st.expr=CONT.test(v)?st.res:"";st.res=st.hist="";st.fresh=false}
  st.expr+=v;render()}
function render(){
  const txt=st.expr||st.res||"0",o=$("#out");o.textContent=txt;
  o.style.fontSize=Math.max(30,64-Math.max(0,txt.length-9)*3)+"px";o.scrollLeft=o.scrollWidth;
  $("#hist").textContent=st.hist||"\u00a0"}
function buildKeys(){
  $("#keys").innerHTML=BASIC.map(([l,v,c])=>`<button data-v="${v}" class="${c||""}">${l}</button>`).join("");
  const list=st.mode==="SCI"?SCI:st.mode==="ADV"?ADV:[];
  const fn=$("#fn");fn.hidden=!list.length;
  fn.innerHTML=list.map(([l,v])=>`<button data-v="${v}">${l}</button>`).join("")}
function flash(b){b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),150)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.mode){st.mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-pressed",x===b));buildKeys();return}
  if(b.id==="ang"){st.deg=!st.deg;b.textContent=st.deg?"DEG":"RAD";return}
  if(b.dataset.v){press(b.dataset.v);flash(b)}});

document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const map={"-":"−","*":"×","/":"÷","Enter":"=","Backspace":"DEL","Escape":"AC","p":"π"};
  let v=map[e.key]||e.key;
  if(!/^(\d|\.|\+|−|×|÷|\^|!|%|\(|\)|=|DEL|AC|π)$/.test(v))return;
  if(e.target.closest&&e.target.closest("button")&&(e.key==="Enter"))return;
  e.preventDefault();press(v);
  const b=[...document.querySelectorAll("button[data-v]")].find(x=>x.dataset.v===v);if(b)flash(b)});

buildKeys();render();
</script>
</body>
</html>
